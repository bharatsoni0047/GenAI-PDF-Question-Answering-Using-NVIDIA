<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="900" height="380" rx="14" fill="#ffffff"/>
<rect width="900" height="380" rx="14" fill="none" stroke="#e2e8f0"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1f2933">The problem that was fixed</text>
<text x="24" y="54" font-size="12" fill="#64748b">Half the documents were never being searched - and nothing said so.</text>
<text x="60" y="96" text-anchor="start" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#dc2626">Before</text>
<text x="200" y="127" text-anchor="end" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Health insurance</text>
<rect x="210" y="112" width="162" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
<rect x="210" y="112" width="162" height="22" rx="4" fill="#059669"/>
<text x="378" y="127" text-anchor="start" font-size="11" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#059669">all of it</text>
<text x="200" y="159" text-anchor="end" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Poverty report</text>
<rect x="210" y="144" width="135" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
<rect x="210" y="144" width="108" height="22" rx="4" fill="#059669"/>
<text x="351" y="159" text-anchor="start" font-size="11" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#dc2626">only 12 of 15 pages</text>
<text x="200" y="191" text-anchor="end" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Household income</text>
<rect x="210" y="176" width="81" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
<text x="297" y="191" text-anchor="start" font-size="11" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#dc2626">NEVER SEARCHED</text>
<text x="200" y="223" text-anchor="end" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Jobs and earnings</text>
<rect x="210" y="208" width="189" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
<text x="405" y="223" text-anchor="start" font-size="11" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#dc2626">NEVER SEARCHED</text>
<text x="60" y="258" text-anchor="start" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#059669">After</text>
<rect x="210" y="272" width="567" height="22" rx="4" fill="#059669"/>
<text x="200" y="287" text-anchor="end" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">All four documents</text>
<text x="783" y="287" text-anchor="start" font-size="11" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#059669">every page</text>
<text x="450" y="336" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">A single instruction cut the list short at thirty pages. Two whole documents were silently left out,</text>
<text x="450" y="354" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">so any question about income or jobs simply could not be answered.</text>
</svg>