<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 436" width="940" height="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="940" height="436" rx="14" fill="#ffffff"/>
<rect width="940" height="436" rx="14" fill="none" stroke="#e2e8f0"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<text x="24" y="34" font-size="16" font-weight="700" fill="#1f2933">From a folder of PDFs to an answer you can check</text>
<text x="24" y="54" font-size="12" fill="#64748b">Twelve steps. Every answer tells you which file and page it came from.</text>
<rect x="24" y="92" width="132" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="90.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Your PDFs</text>
<text x="90.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#64748b">in one folder</text>
<circle cx="36" cy="86" r="9" fill="#2563eb"/>
<text x="36" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
<path d="M156,119.0 L171,119.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="174" y="92" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="240.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Read them</text>
<text x="240.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#64748b">every single page</text>
<circle cx="186" cy="86" r="9" fill="#64748b"/>
<text x="186" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
<path d="M306,119.0 L321,119.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="324" y="92" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="390.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Label each page</text>
<text x="390.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#64748b">file name + page</text>
<circle cx="336" cy="86" r="9" fill="#64748b"/>
<text x="336" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
<path d="M456,119.0 L471,119.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="474" y="92" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="540.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Cut into pieces</text>
<text x="540.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#64748b">small, overlapping</text>
<circle cx="486" cy="86" r="9" fill="#64748b"/>
<text x="486" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
<path d="M606,119.0 L621,119.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="624" y="92" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="690.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Learn the meaning</text>
<text x="690.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#64748b">of every piece</text>
<circle cx="636" cy="86" r="9" fill="#64748b"/>
<text x="636" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>
<path d="M756,119.0 L771,119.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="774" y="92" width="132" height="54" rx="9" fill="#d1fae5" stroke="#059669"/>
<text x="840.0" y="115.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Store it</text>
<text x="840.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#64748b">ready to search</text>
<circle cx="786" cy="86" r="9" fill="#059669"/>
<text x="786" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">6</text>
<path d="M840.0,146 L840.0,234" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="774" y="250" width="132" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
<text x="840.0" y="273.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">You ask</text>
<text x="840.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#64748b">in plain English</text>
<circle cx="786" cy="244" r="9" fill="#2563eb"/>
<text x="786" y="247.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">7</text>
<path d="M774,277.0 L759,277.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="624" y="250" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="690.0" y="273.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Understand it</text>
<text x="690.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#64748b">the same way</text>
<circle cx="636" cy="244" r="9" fill="#64748b"/>
<text x="636" y="247.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">8</text>
<path d="M624,277.0 L609,277.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="474" y="250" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="540.0" y="273.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Find close matches</text>
<text x="540.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#64748b">across all files</text>
<circle cx="486" cy="244" r="9" fill="#64748b"/>
<text x="486" y="247.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">9</text>
<path d="M474,277.0 L459,277.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="324" y="250" width="132" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="390.0" y="273.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Keep the best four</text>
<text x="390.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#64748b">most relevant</text>
<circle cx="336" cy="244" r="9" fill="#64748b"/>
<text x="336" y="247.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">10</text>
<path d="M324,277.0 L309,277.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="174" y="250" width="132" height="54" rx="9" fill="#fef3c7" stroke="#b45309"/>
<text x="240.0" y="273.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Read and answer</text>
<text x="240.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#64748b">using only those</text>
<circle cx="186" cy="244" r="9" fill="#b45309"/>
<text x="186" y="247.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">11</text>
<path d="M174,277.0 L159,277.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="24" y="250" width="132" height="54" rx="9" fill="#d1fae5" stroke="#059669"/>
<text x="90.0" y="273.0" text-anchor="middle" font-size="12.5" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Cite the source</text>
<text x="90.0" y="290.0" text-anchor="middle" font-size="10.5" fill="#64748b">file and page</text>
<circle cx="36" cy="244" r="9" fill="#059669"/>
<text x="36" y="247.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">12</text>
<path d="M90,304 L90,332" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#arrowG)"/>
<rect x="24" y="334" width="290" height="38" rx="9" fill="#d1fae5" stroke="#059669"/>
<text x="169.0" y="357.5" text-anchor="middle" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Answer, with the page it came from</text>
<text x="560" y="404" text-anchor="middle" font-size="12" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#1f2933">Steps 1 to 6 happen once, when you set it up. Steps 7 to 12 happen every time you ask something.</text>
</svg>